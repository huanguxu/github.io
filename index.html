<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FENG'S DS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html,
        body {
            height: 100%;
            background: #f7f7f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            overflow: hidden;
            height: 100vh;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 8px;
            background: white;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .main-content h1 {
            text-align: center;
            color: #f8bbd0;
            font-weight: 700;
            font-size: 24px;
            margin: 10px 0 16px;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        /* ===== 计费时段提示 ===== */
        .billing-hint {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
            margin: -6px 0 10px;
            font-size: 12px;
            line-height: 1.5;
            color: #999;
            text-align: center;
        }
        .billing-state {
            padding: 1px 8px;
            border-radius: 10px;
            background: #f8bbd0;
            color: #5d4037;
            font-weight: 600;
            white-space: nowrap;
        }
        .billing-hint.peak .billing-state {
            background: #ffcdd2;
            color: #b71c1c;
        }
        #chat-box {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 12px 15px 0px 15px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            transition: font-size 0.2s;
            min-height: 0;
        }
        .message-wrapper {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
            max-width: 95%;
        }
        .message-wrapper.user-wrapper {
            align-self: flex-end;
            align-items: flex-end;
        }
        .message-wrapper.ai-wrapper {
            align-self: flex-start;
            align-items: flex-start;
        }
        .message {
            padding: 8px 12px;
            border-radius: 18px;
            word-wrap: break-word;
            width: 100%;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        .user-message {
            background: #ffebee;
            color: #5d4037;
            cursor: pointer;
            transition: background 0.15s;
        }
        .user-message:hover {
            background: #fce4ec;
        }
        .ai-message {
            background: white;
            color: black;
            border: 1px solid #e5e5e5;
        }
        .welcome-message {
            background: white !important;
            color: #333;
            border: 1px solid #f0f0f0;
            cursor: default;
        }
        .welcome-message:hover {
            background: white !important;
        }
        .ai-actions {
            display: flex;
            gap: 12px;
            margin-top: 4px;
            font-size: 14px;
            color: #888;
            user-select: none;
            align-items: center;
            flex-wrap: wrap;
        }
        .ai-actions span {
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 12px;
            transition: background 0.2s;
        }
        .ai-actions span:hover {
            background: #f0f0f0;
        }
        .ai-actions .regenerate-btn {
            font-size: 18px;
            line-height: 1.4;
            padding: 2px 8px;
            margin-top: -5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .ai-actions .version-info {
            cursor: pointer;
            font-size: 13px;
            color: #888;
            padding: 2px 6px;
            line-height: 1.4;
        }
        .ai-actions .version-info:hover {
            background: #f0f0f0;
        }
        .ai-actions .token-stats {
            font-size: 13px;
            color: #aaa;
            padding: 2px 4px;
            line-height: 1.4;
            cursor: default;
        }
        /* ===== 输入区域 ===== */
        .input-area {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 12px;
            flex-shrink: 0;
        }
        .input-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            position: relative;
        }
        #user-input {
            flex: 1;
            padding: 8px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 24px;
            outline: none;
            font-size: 16px;
            font-family: inherit;
            background: white;
            resize: none;
            height: 40px;
            min-height: 40px;
            max-height: 150px;
            line-height: 1.4;
            transition: border-color 0.2s;
            overflow-y: auto;
            box-sizing: border-box;
            align-self: flex-end;
        }
        #user-input.editing-mode {
            border-color: #f8bbd0;
            border-width: 2px;
        }
        .edit-indicator {
            position: absolute;
            left: 16px;
            top: -10px;
            background: #f8bbd0;
            color: #5d4037;
            font-size: 12px;
            padding: 0 8px;
            border-radius: 10px;
            display: none;
            pointer-events: none;
            font-weight: 500;
        }
        .edit-indicator.show {
            display: block;
        }
        #send-btn {
            background: #f8bbd0;
            color: #5d4037;
            border: none;
            border-radius: 24px;
            padding: 8px 24px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
            height: 40px;
            align-self: flex-end;
            box-sizing: border-box;
            flex-shrink: 0;
        }
        #send-btn:active {
            background: #f48fb1;
            transform: scale(0.96);
        }
        #send-btn:disabled {
            background: #e0e0e0;
            color: #9e9e9e;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            text-align: center;
            color: #888;
            font-style: italic;
            margin-top: 2px;
            min-height: 18px;
            font-size: 14px;
            flex-shrink: 0;
        }
        .error {
            color: #d32f2f;
        }
        /* ===== 菜单按钮与加号 ===== */
        #menu-btn,
        #new-chat-btn {
            position: fixed;
            top: 25px;
            z-index: 1000;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f8bbd0;
            cursor: pointer;
            transition: transform 0.2s;
            line-height: 1;
            border: none;
            background: none;
            padding: 0;
        }
        #menu-btn {
            left: 20px;
            font-size: 28px;
            font-weight: 700;
        }
        #new-chat-btn {
            right: 20px;
            font-size: 40px;
            font-weight: 400;
        }
        #menu-btn:active,
        #new-chat-btn:active {
            transform: scale(0.85);
        }
        #new-chat-btn:hover,
        #new-chat-btn:focus {
            background: none !important;
        }
        /* ===== 角色（本对话人设）按钮 ===== */
        #char-btn {
            position: fixed;
            top: 34px;
            right: 64px;
            z-index: 1000;
            height: 24px;
            padding: 0 9px;
            border-radius: 12px;
            border: 1px solid #f8bbd0;
            background: rgba(248, 187, 208, 0.14);
            color: #f06292;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }
        #char-btn:hover {
            background: rgba(248, 187, 208, 0.3);
        }
        #char-btn:active {
            transform: scale(0.92);
        }
        #char-btn.has-persona {
            background: rgba(248, 187, 208, 0.4);
            border-color: #f48fb1;
            font-weight: 600;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 85%;
            max-width: 400px;
            height: 100%;
            background: white;
            z-index: 1000;
            box-shadow: 2px 0 12px rgba(0, 0, 0, 0.1);
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            padding: 30px 20px 2px;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .sidebar.open {
            transform: translateX(0);
        }
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
            flex-shrink: 0;
        }
        .search-container input {
            flex: 1;
            padding: 10px 16px;
            border: 1.5px solid #e5e5e5;
            border-radius: 24px;
            outline: none;
            font-size: 16px;
            background: #fafafa;
            transition: border-color 0.2s;
        }
        .search-container input:focus {
            border-color: #f8bbd0;
        }
        .search-container button {
            background: #f8bbd0;
            color: #5d4037;
            border: none;
            border-radius: 24px;
            padding: 10px 18px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }
        .search-container button:active {
            background: #f48fb1;
            transform: scale(0.95);
        }
        .history-section {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0 4px 0;
            display: flex;
            flex-direction: column;
        }
        .history-main-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 2px solid #f0f0f0;
            letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .history-date {
            font-size: 16px;
            font-weight: 700;
            color: #5d4037;
            background: #f8bbd0;
            padding: 4px 12px;
            border-radius: 20px;
            margin: 10px 0 8px 0;
            display: inline-block;
            align-self: flex-start;
            letter-spacing: 0.3px;
        }
        .history-item {
            display: flex;
            flex-direction: column;
            background: #f9f9f9;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 3px solid #f8bbd0;
            position: relative;
            user-select: none;
            flex-shrink: 0;
            min-height: 60px;
            justify-content: center;
            gap: 4px;
        }
        .history-item:hover {
            background: #f0f0f0;
        }
        .history-item.pinned {
            border-left-color: #ffb74d;
            background: #fff8e1;
        }
        .history-item .question-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 10px;
        }
        .history-item .question-text {
            font-weight: 700;
            color: #333;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
            min-width: 0;
        }
        .history-item .time {
            color: #bbb;
            font-size: 12px;
            white-space: nowrap;
            flex-shrink: 0;
            margin-left: 8px;
        }
        .history-item .preview-row {
            font-weight: 400;
            font-size: 13px;
            color: #999;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            padding-left: 0;
        }
        .no-history {
            color: #ccc;
            text-align: center;
            margin-top: 30px;
            font-size: 15px;
        }
        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid #f0f0f0;
            padding: 2px 0 0 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            min-height: 24px;
            flex-shrink: 0;
        }
        #settings-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            margin-top: 0px;
        }
        #settings-btn:active {
            transform: scale(0.85);
            opacity: 0.7;
        }
        #settings-btn svg {
            width: 32px;
            height: 32px;
            fill: #f8bbd0;
            transition: fill 0.2s;
        }
        #settings-btn:hover svg {
            fill: #f48fb1;
        }
        .settings-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .settings-overlay.active {
            display: flex;
        }
        .settings-card {
            background: white;
            border-radius: 20px;
            padding: 30px 28px;
            max-width: 420px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .settings-card h2 {
            text-align: center;
            color: #f8bbd0;
            font-weight: 600;
            margin: 0 0 24px 0;
            font-size: 22px;
            letter-spacing: 0.5px;
        }
        .settings-item {
            margin-bottom: 28px;
        }
        .settings-item label {
            display: block;
            font-weight: 700;
            color: #555;
            font-size: 15px;
            margin-bottom: 6px;
        }
        .api-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .api-row input {
            flex: 1;
            padding: 10px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
            background: #fafafa;
            min-width: 0;
        }
        .api-row input:focus {
            border-color: #f8bbd0;
        }
        .api-row .btn-icon {
            background: #f0f0f0;
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            font-size: 14px;
            color: #555;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
            font-family: inherit;
        }
        .api-row .btn-icon:hover {
            background: #e0e0e0;
        }
        .api-row .btn-icon:active {
            transform: scale(0.95);
        }
        .api-row .btn-icon.copy-btn {
            background: #f8bbd0;
            color: #5d4037;
        }
        .api-row .btn-icon.copy-btn:hover {
            background: #f48fb1;
        }
        .settings-item select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border 0.2s;
            background: #fafafa;
        }
        .settings-item select:focus {
            border-color: #f8bbd0;
        }
        .settings-item textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            transition: border 0.2s;
            background: #fafafa;
            resize: vertical;
            font-family: inherit;
            min-height: 70px;
            display: block;
        }
        .settings-item textarea:focus {
            border-color: #f8bbd0;
        }
        .settings-item .range-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .settings-item .range-row input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: #e0e0e0;
            outline: none;
            transition: background 0.2s;
        }
        .settings-item .range-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #f8bbd0;
            cursor: pointer;
            border: none;
        }
        .settings-item .range-row input[type="range"]::-webkit-slider-thumb:hover {
            background: #f48fb1;
        }
        .settings-item .range-row span {
            min-width: 36px;
            text-align: center;
            font-weight: 500;
            color: #555;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #f8bbd0;
            cursor: pointer;
        }
        .checkbox-row label {
            font-weight: 400;
            color: #333;
            cursor: pointer;
        }
        .settings-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }
        .settings-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .settings-actions .save-btn {
            background: #f8bbd0;
            color: #5d4037;
        }
        .settings-actions .save-btn:active {
            background: #f48fb1;
            transform: scale(0.96);
        }
        .settings-actions .close-btn {
            background: #f0f0f0;
            color: #555;
        }
        .settings-actions .close-btn:active {
            background: #e0e0e0;
            transform: scale(0.96);
        }
        .context-menu {
            display: none;
            position: fixed;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            padding: 8px 0;
            min-width: 140px;
            z-index: 2000;
            overflow: hidden;
            border: 1px solid #eee;
        }
        .context-menu.active {
            display: block;
        }
        .context-menu button {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            border: none;
            background: none;
            text-align: left;
            font-size: 15px;
            color: #333;
            cursor: pointer;
            transition: background 0.15s;
            font-family: inherit;
            border-bottom: 1px solid #f5f5f5;
        }
        .context-menu button:last-child {
            border-bottom: none;
        }
        .context-menu button:hover {
            background: #f5f5f5;
        }
        .context-menu button:active {
            background: #eee;
        }
        .context-menu button svg {
            flex-shrink: 0;
            color: #f8bbd0;
            transition: color 0.2s;
        }
        .context-menu button:hover svg {
            color: #f48fb1;
        }
        #menu-pin svg {
            transform: rotate(30deg);
            display: inline-block;
        }
        .context-menu .danger {
            color: #d32f2f;
        }
        .context-menu .danger svg {
            color: #d32f2f;
        }
        .context-menu .danger:hover svg {
            color: #b71c1c;
        }
        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .main-content {
                padding: 15px 12px 6px;
            }
            .billing-hint {
                font-size: 11px;
                gap: 6px;
                margin: -2px 0 8px;
            }
            #chat-box {
                padding: 10px 12px 0px 12px;
            }
            #menu-btn,
            #new-chat-btn {
                top: 22px;
                width: 34px;
                height: 34px;
            }
            #menu-btn {
                left: 16px;
                font-size: 24px;
                font-weight: 700;
            }
            #new-chat-btn {
                right: 16px;
                font-size: 34px;
                font-weight: 400;
            }
            .search-container input {
                font-size: 14px;
                padding: 8px 14px;
            }
            .search-container button {
                font-size: 14px;
                padding: 8px 14px;
            }
            #settings-btn svg {
                width: 28px;
                height: 28px;
                margin-top: 0px;
            }
            .sidebar-footer {
                padding: 2px 0 0 0;
                min-height: 20px;
            }
            .settings-card {
                padding: 24px 20px;
            }
            .api-row .btn-icon {
                font-size: 12px;
                padding: 6px 10px;
            }
            .settings-item {
                margin-bottom: 24px;
            }
            .ai-actions {
                font-size: 12px;
                gap: 8px;
            }
            .ai-actions .regenerate-btn {
                font-size: 16px;
            }
            .ai-actions .version-info,
            .ai-actions .token-stats {
                font-size: 12px;
            }
            .history-main-title {
                font-size: 18px;
            }
            .history-date {
                font-size: 14px;
                padding: 4px 12px;
            }
            .history-item {
                padding: 8px 10px;
                min-height: 52px;
            }
            .history-item .question-text {
                font-size: 14px;
            }
            .history-item .time {
                font-size: 11px;
            }
            .history-item .preview-row {
                font-size: 12px;
            }
            #user-input {
                height: 36px;
                min-height: 36px;
                max-height: 120px;
                padding: 6px 14px;
                font-size: 15px;
            }
            #send-btn {
                height: 36px;
                padding: 6px 18px;
                font-size: 15px;
            }
            .edit-indicator {
                font-size: 11px;
                top: -8px;
                left: 14px;
                padding: 0 6px;
            }
            .input-area {
                margin-top: 12px;
                gap: 4px;
            }
            .status {
                margin-top: 1px;
                min-height: 16px;
                font-size: 13px;
            }

    <script>
        // ============================================================
        // 1. 配置与 DOM 引用
        // ============================================================
        const STORAGE_KEYS = {
            apiKey: 'fengs_api_key',
            model: 'fengs_model',
            fontSize: 'fengs_font_size',
            showToken: 'fengs_show_token',
            memoryStrategy: 'fengs_memory_strategy',
            historyWindow: 'fengs_history_window',
            cardFreq: 'fengs_card_freq',
            persona: 'fengs_persona',
            memo: 'fengs_memo',
            styleSamples: 'fengs_style_samples',
            bannedWords: 'fengs_banned_words',
            replyLength: 'fengs_reply_length',
            thinking: 'fengs_thinking',
            autoRewrite: 'fengs_auto_rewrite',
            temperature: 'fengs_temperature',
            sessions: 'fengs_sessions'
        };
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const menuBtn = document.getElementById('menu-btn');
        const newChatBtn = document.getElementById('new-chat-btn');
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const statusMsg = document.getElementById('status-message');
        const historyContainer = document.getElementById('history-container');
        const contextMenu = document.getElementById('context-menu');
        const settingsBtn = document.getElementById('settings-btn');
        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const editIndicator = document.getElementById('edit-indicator');
        const settingsOverlay = document.getElementById('settings-overlay');
        const apiKeyInput = document.getElementById('api-key-input');
        const modelSelect = document.getElementById('model-select');
        const fontSizeRange = document.getElementById('font-size-range');
        const fontSizeLabel = document.getElementById('font-size-label');
        const settingsSave = document.getElementById('settings-save');
        const settingsClose = document.getElementById('settings-close');
        const togglePwdBtn = document.getElementById('toggle-pwd-btn');
        const copyApiBtn = document.getElementById('copy-api-btn');
        const showTokenCheckbox = document.getElementById('show-token-checkbox');
        const memoryStrategySelect = document.getElementById('memory-strategy-select');
        const charBtn = document.getElementById('char-btn');
        const charOverlay = document.getElementById('char-overlay');
        const charPersonaInput = document.getElementById('char-persona');
        const charStyleInput = document.getElementById('char-style');
        const charMemoInput = document.getElementById('char-memo');
        const charMemoryInput = document.getElementById('char-memory');
        const windowSelect = document.getElementById('window-select');
        const cardFreqSelect = document.getElementById('card-freq-select');
        const charSaveBtn = document.getElementById('char-save');
        const charCloseBtn = document.getElementById('char-close');
        const bannedInput = document.getElementById('banned-input');
        const replyLengthSelect = document.getElementById('reply-length-select');
        const thinkingCheckbox = document.getElementById('thinking-checkbox');
        const autoRewriteCheckbox = document.getElementById('auto-rewrite-checkbox');
        const temperatureRange = document.getElementById('temperature-range');
        const temperatureLabel = document.getElementById('temperature-label');
        // ============================================================
        // 2. 全局变量
        // ============================================================
        let messages = [];
        let isGenerating = false;
        let memoryUpdating = false;
        const WELCOME_TEXT = '甜心，祝你今天过得愉快！';
        let showTokenStats = true;
        let currentSessionId = null;
        let searchKeyword = '';
        let editingUserIndex = -1;
        let editingDraft = '';
        let originalText = '';
        // ============================================================
        // 3. 数据管理
        // ============================================================
        function getSessions() {
            const stored = localStorage.getItem(STORAGE_KEYS.sessions);
            return stored ? JSON.parse(stored) : [];
        }
        function saveSessions(sessions) {
            localStorage.setItem(STORAGE_KEYS.sessions, JSON.stringify(sessions));
        }
        function saveCurrentSession() {
            if (messages.length === 1 && messages[0].type === 'ai' && messages[0].text === WELCOME_TEXT) return;
            if (messages.length === 0) return;
            const sessions = getSessions();
            if (currentSessionId) {
                const idx = sessions.findIndex(s => s.id === currentSessionId);
                if (idx !== -1) {
                    sessions[idx].messages = JSON.parse(JSON.stringify(messages));
                    sessions[idx].timestamp = Date.now();
                    const firstUser = messages.find(m => m.type === 'user');
                    sessions[idx].title = firstUser ? firstUser.text : '新对话';
                    saveSessions(sessions);
                    return;
                }
            }
            const firstUser = messages.find(m => m.type === 'user');
            const title = firstUser ? firstUser.text : '新对话';
            const newSession = {
                id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
                title: title,
                messages: JSON.parse(JSON.stringify(messages)),
                timestamp: Date.now(),
                pinned: false
            };
            sessions.push(newSession);
            saveSessions(sessions);
            currentSessionId = newSession.id;
            // 把「草稿」里这份人设跟着这段对话一起落盘
            const charMap = getCharConfigMap();
            if (charMap['draft']) {
                charMap[newSession.id] = charMap['draft'];
                delete charMap['draft'];
                saveCharConfigMap(charMap);
            }
        }
        function loadSession(sessionId) {
            const sessions = getSessions();
            const session = sessions.find(s => s.id === sessionId);
            if (!session) return false;
            exitEditMode(true);
            saveCurrentSession();
            messages = JSON.parse(JSON.stringify(session.messages));
            currentSessionId = sessionId;
            updateCharBtnHint();
            renderMessages();
            chatBox.scrollTop = chatBox.scrollHeight;
            userInput.value = '';
            autoResize(userInput);
            statusMsg.textContent = '';
            closeSidebar();
            // 有历史、没角色卡：读完整段对话再补
            setTimeout(ensureCharacterCard, 100);
            return true;
        }
        function deleteSession(sessionId) {
            let sessions = getSessions();
            sessions = sessions.filter(s => s.id !== sessionId);
            saveSessions(sessions);
            if (currentSessionId === sessionId) {
                resetChat();
            }
            renderHistory();
        }
        function togglePinned(sessionId) {
            const sessions = getSessions();
            const session = sessions.find(s => s.id === sessionId);
            if (session) {
                session.pinned = !session.pinned;
                saveSessions(sessions);
                renderHistory();
            }
        }
        function renameSession(sessionId, newTitle) {
            const sessions = getSessions();
            const session = sessions.find(s => s.id === sessionId);
            if (session) {
                session.title = newTitle;
                saveSessions(sessions);
                renderHistory();
            }
        }
        // ============================================================
        // 4. 工具函数
        // ============================================================
        function estimateTokens(text) {
            if (!text) return 0;
            let chineseCount = 0,
                otherCount = 0;
            for (let i = 0; i < text.length; i++) {
                const code = text.charCodeAt(i);
                if (code >= 0x4E00 && code <= 0x9FFF) chineseCount++;
                else otherCount++;
            }
            return Math.ceil(chineseCount * 1.5 + otherCount * 0.8);
        }
        function getMemoryStrategy() {
            return localStorage.getItem(STORAGE_KEYS.memoryStrategy) || 'no-compress';
        }
        // ----- 计费时段（北京时间）：高峰 09:00–12:00、14:00–18:00（周一至周五），其余为普通时段（高峰五折） -----
        // 官方口径：高峰为 UTC 01:00-04:00、06:00-10:00，周一至周五，中国法定节假日除外
        // 节假日自动识别：内置国务院公布安排（2026 国办发明电〔2025〕7号、2027 国办发明电〔2026〕10号），
        // 联网时按年份自动补齐（含未来年份），断网或接口失效则回退到内置表
        const BUILTIN_HOLIDAYS = [
            { name: '元旦', start: '2026-01-01', end: '2026-01-03' },
            { name: '春节', start: '2026-02-15', end: '2026-02-23' },
            { name: '清明节', start: '2026-04-04', end: '2026-04-06' },
            { name: '劳动节', start: '2026-05-01', end: '2026-05-05' },
            { name: '端午节', start: '2026-06-19', end: '2026-06-21' },
            { name: '中秋节', start: '2026-09-25', end: '2026-09-27' },
            { name: '国庆节', start: '2026-10-01', end: '2026-10-07' },
            { name: '元旦', start: '2027-01-01', end: '2027-01-03' },
            { name: '春节', start: '2027-02-05', end: '2027-02-13' },
            { name: '清明节', start: '2027-04-03', end: '2027-04-05' },
            { name: '劳动节', start: '2027-05-01', end: '2027-05-05' },
            { name: '端午节', start: '2027-06-09', end: '2027-06-09' },
            { name: '中秋节', start: '2027-09-15', end: '2027-09-15' },
            { name: '国庆节', start: '2027-10-01', end: '2027-10-07' }
        ];
        const HOLIDAY_SOURCE = 'https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/';
        const HOLIDAY_CACHE_KEY = 'fengs_holiday_cache';
        const HOLIDAY_CACHE_TTL = 7 * 24 * 60 * 60 * 1000; // 在线数据本地缓存 7 天
        const offDayNames = {};   // 'YYYY-MM-DD' -> 节假日名称
        const holidayYears = {};  // 'YYYY' -> true，表示该年节假日数据可用
        function formatDateKey(d) {
            return d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
        }
        function addOffDay(dateKey, name) {
            offDayNames[dateKey] = name || '节假日';
        }
        function loadBuiltinHolidays() {
            BUILTIN_HOLIDAYS.forEach(item => {
                const start = new Date(item.start + 'T00:00:00');
                const end = new Date(item.end + 'T00:00:00');
                for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
                    addOffDay(formatDateKey(d), item.name);
                }
                holidayYears[item.start.slice(0, 4)] = true;
            });
        }
        function readHolidayCache() {
            try {
                return JSON.parse(localStorage.getItem(HOLIDAY_CACHE_KEY) || '{}');
            } catch (e) {
                return {};
            }
        }
        function mergeHolidayDays(days) {
            if (!days) return false;
            const keys = Object.keys(days);
            keys.forEach(k => addOffDay(k, days[k]));
            return keys.length > 0;
        }
        async function syncHolidayYear(year) {
            const yearKey = String(year);
            const cache = readHolidayCache();
            const entry = cache[yearKey];
            if (entry && entry.days && (Date.now() - (entry.ts || 0) < HOLIDAY_CACHE_TTL)) {
                if (mergeHolidayDays(entry.days)) holidayYears[yearKey] = true;
                return;
            }
            try {
                const resp = await fetch(HOLIDAY_SOURCE + yearKey + '.json', { cache: 'no-cache' });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                const days = {};
                (data.days || []).forEach(d => {
                    if (d.isOffDay) days[d.date] = d.name || '节假日';
                });
                if (Object.keys(days).length === 0) throw new Error('empty');
                cache[yearKey] = { ts: Date.now(), days: days };
                try {
                    localStorage.setItem(HOLIDAY_CACHE_KEY, JSON.stringify(cache));
                } catch (e) { /* 存储写满时忽略，本次仍可用 */ }
                if (mergeHolidayDays(days)) holidayYears[yearKey] = true;
            } catch (e) {
                // 联网失败：沿用本地缓存或内置表，不影响高峰判断
                if (entry && entry.days && mergeHolidayDays(entry.days)) holidayYears[yearKey] = true;
            }
        }
        async function initHolidayData() {
            loadBuiltinHolidays();
            const thisYear = new Date().getFullYear();
            await syncHolidayYear(thisYear);
            await syncHolidayYear(thisYear + 1);
            updateBillingState();
        }
        function isPeakNow() {
            const now = new Date();
            const utcDay = now.getUTCDay();
            const utcHour = now.getUTCHours();
            if (offDayNames[formatDateKey(now)]) return false;
            if (utcDay === 0 || utcDay === 6) return false;
            return (utcHour >= 1 && utcHour < 4) || (utcHour >= 6 && utcHour < 10);

                                if (onChunk) onChunk(fullReply);
                            }
                        } catch (e) { /* 忽略 */ }
                    }
                }
            }
            return fullReply;
        }

        function resetChat() {

            ];

            const charMap = getCharConfigMap();

        // 把流式输出写进指定消息（含版本），供「首版」和「重写版」共用
        function streamInto(history, aiMsg, options) {
            return generateAIResponse(history, (chunk) => {
                aiMsg.text = chunk;
                const vi = aiMsg.currentVersion || 0;
                if (aiMsg.versions && aiMsg.versions[vi]) {
                    aiMsg.versions[vi].text = chunk;
                }
                renderMessages();
            }, options);

        async function sendMessage() {
            // 如果策略为compress且消息数>80，自动压缩（压缩后不再立即渲染保存，由后续统一处理）
            if (getMemoryStrategy() === 'compress' && messages.length > 80) {
                await compressConversation();
                // 压缩后需要立即保存状态，否则如果后续发送失败会丢失压缩结果
                saveCurrentSession();
            }
            const text = userInput.value.trim();
            if (!text) {
                if (editingUserIndex >= 0) {
                    exitEditMode(false);
                }
                return;
            }
            if (isGenerating) {
                alert('正在生成中，请稍候');
                return;
            }
            if (editingUserIndex >= 0) {
                commitEdit();
                return;
            }
            if (messages.length === 1 && messages[0].type === 'ai' && messages[0].text === WELCOME_TEXT) {
                messages = [];
            }
            // 新对话的第一句：原样写进角色设定，不改一个字
            const isFirstUserMsg = !messages.some(m => m.type === 'user');
            if (isFirstUserMsg) {
                const cfg = getCharConfig();
                if (!cfg.persona.trim()) {
                    setCharConfig(Object.assign({}, cfg, { persona: text }));
                }
            }
            const userMsg = { type: 'user', text: text };
            messages.push(userMsg);
            const aiMsg = { type: 'ai', text: '...', versions: [{ text: '...', cumulativeTokens: 0 }], currentVersion: 0 };
            messages.push(aiMsg);
            renderMessages();
            const lastWrapper = chatBox.lastElementChild;
            if (lastWrapper) {
                lastWrapper.scrollIntoView({ block: 'start' });
            }
            userInput.value = '';
            autoResize(userInput);
            statusMsg.textContent = 'DeepSeek 正在思考...';
            sendBtn.disabled = true;
            isGenerating = true;
            try {
                const history = messages.slice(0, -1);
                const prevAiText = findPreviousAiText(history);
                const userCtx = (history.filter(m => m.type === 'user').pop() || {}).text || '';
                const rp = getRPConfig();
                let fullReply = await streamInto(history, messages[messages.length - 1]);
                if (rp.autoRewrite && fullReply) {
                    const audit = auditReply(fullReply, prevAiText, userCtx);
                    if (audit.needRewrite) {
                        statusMsg.textContent = '第 2 版：换一种写法…';
                        fullReply = await streamInto(history, messages[messages.length - 1], {
                            temperature: rp.temperature + 0.2,
                            retryHint: audit.issues.join('；')
                        });
                    }
                }
                const lastMsg = messages[messages.length - 1];
                if (lastMsg.type === 'ai') {
                    lastMsg.text = fullReply || '（AI没有返回内容）';
                    lastMsg.versions[0].text = lastMsg.text;
                    lastMsg.currentVersion = 0;
                    const cumulative = calculateTotalTokens();
                    lastMsg.versions[0].cumulativeTokens = cumulative;
                    lastMsg.cumulativeTokens = cumulative;
                }
                saveCurrentSession();
                statusMsg.textContent = '';
                maybeUpdateMemory();
            } catch (error) {
                console.error(error);
                const lastMsg = messages[messages.length - 1];
                if (lastMsg.type === 'ai') {
                    lastMsg.text = `❌ ${error.message || '未知错误'}`;
                    lastMsg.versions[0].text = lastMsg.text;
                    const cumulative = calculateTotalTokens();
                    lastMsg.versions[0].cumulativeTokens = cumulative;
                    lastMsg.cumulativeTokens = cumulative;
                }
                statusMsg.textContent = '发送失败，请检查网络或设置';
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
                renderMessages();
            }
        }
        async function regenerateAIMessage(index) {
            if (isGenerating) {
                alert('正在生成中，请稍候');
                return;
            }
            if (index < 0 || index >= messages.length || messages[index].type !== 'ai') return;
            let userIndex = -1;
            for (let i = index - 1; i >= 0; i--) {
                if (messages[i].type === 'user') {
                    userIndex = i;
                    break;
                }
            }
            if (userIndex === -1) {
                alert('无法找到对应的用户消息');
                return;
            }
            const aiMsg = messages[index];
            ensureVersionObjects(aiMsg);
            aiMsg.versions.push({ text: '...', cumulativeTokens: 0 });
            aiMsg.currentVersion = aiMsg.versions.length - 1;
            aiMsg.text = '...';
            messages = messages.slice(0, index + 1);
            renderMessages();
            const lastWrapper = chatBox.lastElementChild;
            if (lastWrapper) {
                lastWrapper.scrollIntoView({ block: 'start' });
            }
            statusMsg.textContent = '重新生成中...';
            sendBtn.disabled = true;
            isGenerating = true;
            try {
                const history = messages.slice(0, -1);
                const prevAiText = findPreviousAiText(history);
                const userCtx = (history.filter(m => m.type === 'user').pop() || {}).text || '';
                const rp = getRPConfig();
                // 每重新生成一次，温度上调一档，避免和上一版答案高度雷同
                const regenerateTemperature = rp.temperature + REGENERATE_TEMPERATURE_STEP * (aiMsg.versions.length - 1);
                let fullReply = await streamInto(history, aiMsg, { temperature: regenerateTemperature });
                if (rp.autoRewrite && fullReply) {
                    const audit = auditReply(fullReply, prevAiText, userCtx);
                    if (audit.needRewrite) {
                        statusMsg.textContent = '第 2 版：换一种写法…';
                        fullReply = await streamInto(history, aiMsg, {
                            temperature: regenerateTemperature + 0.2,
                            retryHint: audit.issues.join('；')
                        });
                    }
                }
                const lastIdx = aiMsg.versions.length - 1;
                aiMsg.text = fullReply || '（AI没有返回内容）';
                aiMsg.versions[lastIdx].text = aiMsg.text;
                const cumulative = calculateTotalTokens();
                aiMsg.versions[lastIdx].cumulativeTokens = cumulative;
                aiMsg.cumulativeTokens = cumulative;
                saveCurrentSession();
                statusMsg.textContent = '';
            } catch (error) {
                console.error(error);
                const lastIdx = aiMsg.versions.length - 1;
                aiMsg.versions[lastIdx].text = `❌ ${error.message || '未知错误'}`;
                aiMsg.text = `❌ ${error.message || '未知错误'}`;
                const cumulative = calculateTotalTokens();
                aiMsg.versions[lastIdx].cumulativeTokens = cumulative;
                aiMsg.cumulativeTokens = cumulative;
                statusMsg.textContent = '重新生成失败，请检查网络或设置';
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
                renderMessages();
            }
        }

        function renderHistory() {
            const sessions = getSessions();
            let html = '<div class="history-main-title">历史记录</div>';
            if (sessions.length === 0) {
                html += '<div class="no-history">暂无对话记录</div>';
                historyContainer.innerHTML = html;
                return;
            }
            let filtered = sessions;
            if (searchKeyword) {
                filtered = sessions.filter(s => s.title.toLowerCase().includes(searchKeyword));
                if (filtered.length === 0) {
                    html += '<div class="no-history">没有找到匹配的记录</div>';
                    historyContainer.innerHTML = html;
                    return;
                }
            }
            const pinned = filtered.filter(s => s.pinned);
            const unpinned = filtered.filter(s => !s.pinned);
            pinned.sort((a, b) => b.timestamp - a.timestamp);
            unpinned.sort((a, b) => b.timestamp - a.timestamp);
            const groups = {};
            unpinned.forEach(entry => {
                const date = new Date(entry.timestamp);
                const dateStr = date.getFullYear() + '-' +
                    String(date.getMonth() + 1).padStart(2, '0') + '-' +
                    String(date.getDate()).padStart(2, '0');
                if (!groups[dateStr]) groups[dateStr] = [];
                groups[dateStr].push(entry);
            });
            const sortedDates = Object.keys(groups).sort((a, b) => b.localeCompare(a));
            if (pinned.length > 0) {
                html += `<div class="history-date">📌 置顶</div>`;
                pinned.forEach(session => {
                    html += buildSessionItemHtml(session);
                });
            }
            sortedDates.forEach(dateStr => {
                html += `<div class="history-date">${dateStr}</div>`;
                const entries = groups[dateStr].sort((a, b) => b.timestamp - a.timestamp);
                entries.forEach(entry => {
                    html += buildSessionItemHtml(entry);
                });
            });
            historyContainer.innerHTML = html;
            document.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', function(e) {
                    if (this.dataset.longpress === 'true') {
                        this.dataset.longpress = 'false';
                        return;
                    }
                    const id = this.dataset.id;
                    loadSession(id);
                });
            });
            document.querySelectorAll('.history-item').forEach(item => {
                item.removeEventListener('touchstart', handleTouchStart);
                item.removeEventListener('touchend', handleTouchEnd);
                item.removeEventListener('touchmove', handleTouchMove);
                item.removeEventListener('contextmenu', handleContextMenu);
                item.addEventListener('touchstart', handleTouchStart);
                item.addEventListener('touchend', handleTouchEnd);
                item.addEventListener('touchmove', handleTouchMove);
                item.addEventListener('contextmenu', handleContextMenu);
            });

            const pinnedClass = session.pinned ? 'pinned' : '';
            let previewText = '（暂无内容）';
            let foundUser = false;
            for (let i = 0; i < session.messages.length; i++) {
                const msg = session.messages[i];
                if (msg.type === 'user') {
                    foundUser = true;
                } else if (foundUser && msg.type === 'ai' && msg.text !== WELCOME_TEXT) {
                    previewText = msg.text;

            if (previewText.length > 50) {
                previewText = previewText.substring(0, 50) + '...';

                        <div class="question-row">

            }
            localStorage.setItem('fengs_migrated_v25', '1');
        }
        function init() {
            migrateTokenSettings();
            loadSettings();
            updateBillingState();
            initHolidayData();
            setInterval(updateBillingState, 60000);
            const sessions = getSessions();
            if (sessions.length > 0) {
                sessions.sort((a, b) => b.timestamp - a.timestamp);
                loadSession(sessions[0].id);
            } else {
                resetChat();
            }
            autoResize(userInput);
            renderHistory();
            migrateLegacyCharConfig();
            updateCharBtnHint();
            userInput.focus();
        }
        window.addEventListener('load', init);
    </script>
</body>
</html>
